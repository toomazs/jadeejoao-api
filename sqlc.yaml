# sqlc 1.31.x — one generated package per domain module (repository privacy,
# AD-4). Regenerate with:
#   go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.0 generate
version: "2"

overrides:
  go:
    overrides: &overrides
      - db_type: "uuid"
        go_type: "github.com/google/uuid.UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "NullUUID"
      - db_type: "timestamptz"
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true
      - db_type: "pg_catalog.int8"
        nullable: true
        go_type:
          type: "int64"
          pointer: true
      - db_type: "pg_catalog.int4"
        nullable: true
        go_type:
          type: "int32"
          pointer: true

sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/content.sql"
    gen:
      go:
        package: "contentdb"
        out: "internal/content/contentdb"
        sql_package: "pgx/v5"
        overrides: *overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/guests.sql"
    gen:
      go:
        package: "guestsdb"
        out: "internal/guests/guestsdb"
        sql_package: "pgx/v5"
        overrides: *overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/gifts.sql"
    gen:
      go:
        package: "giftsdb"
        out: "internal/gifts/giftsdb"
        sql_package: "pgx/v5"
        overrides: *overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/messages.sql"
    gen:
      go:
        package: "messagesdb"
        out: "internal/messages/messagesdb"
        sql_package: "pgx/v5"
        overrides: *overrides
