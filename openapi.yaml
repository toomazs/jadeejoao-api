components:
  schemas:
    BigDayPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        programme:
          items:
            $ref: "#/components/schemas/ProgrammeItem"
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
        venue_notes:
          description: Venue guidance (outdoor, grass — advise footwear).
          type: string
      required:
        - title
      type: object
    ContentOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ContentOutputBody.json
          format: uri
          readOnly: true
          type: string
        sections:
          items:
            $ref: "#/components/schemas/Section"
          type:
            - array
            - "null"
      required:
        - sections
      type: object
    DressCodePayload:
      additionalProperties: false
      properties:
        attire:
          description: Short dress-code formula.
          examples:
            - Sofisticado, confortável, vestido longo, esporte fino.
          type: string
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GettingTherePayload:
      additionalProperties: false
      properties:
        address:
          examples:
            - Rua Piraju, 306 – Jardim Paulista, Atibaia – SP, 12947-321
          type: string
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        map_embed_url:
          format: uri
          type: string
        parking_notes:
          type: string
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - address
        - title
      type: object
    GiftsIntroPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
    GoodPracticesPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        rules:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
    GroupView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GroupView.json
          format: uri
          readOnly: true
          type: string
        group_id:
          format: uuid
          type: string
        label:
          examples:
            - Eduardo e família
          type: string
        members:
          items:
            $ref: "#/components/schemas/MemberView"
          type:
            - array
            - "null"
      required:
        - group_id
        - label
        - members
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Overall service status.
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    HeroPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        city_label:
          examples:
            - Atibaia – SP
          type: string
        couple_names:
          examples:
            - Jade & João
          type: string
        event_datetime:
          description: Ceremony start, ISO 8601 with America/Sao_Paulo offset.
          examples:
            - "2027-08-07T15:00:00-03:00"
          format: date-time
          type: string
        hero_image_url:
          format: uri
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - couple_names
        - event_datetime
        - city_label
        - title
      type: object
    Lodging:
      additionalProperties: false
      properties:
        area:
          examples:
            - Centro
          type: string
        link:
          format: uri
          type: string
        name:
          examples:
            - Pousada Jardim
          type: string
        notes:
          type: string
        shuttle_served:
          description: Whether the wedding shuttle (translado) serves this lodging.
          type: boolean
      required:
        - name
        - shuttle_served
      type: object
    LookupInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LookupInputBody.json
          format: uri
          readOnly: true
          type: string
        full_name:
          description: Full name as written on the invitation. Matching is exact after normalization (case and accents ignored).
          examples:
            - Eduardo Silva
          maxLength: 200
          minLength: 1
          type: string
      required:
        - full_name
      type: object
    MemberView:
      additionalProperties: false
      properties:
        attending:
          enum:
            - pending
            - "yes"
            - "no"
          type: string
        category:
          enum:
            - adult
            - child
            - baby
            - elderly
          type: string
        full_name:
          examples:
            - Eduardo Silva
          type: string
        guest_id:
          format: uuid
          type: string
        is_primary:
          description: Whether this guest is the group's primary contact.
          type: boolean
      required:
        - guest_id
        - full_name
        - is_primary
        - attending
      type: object
    MessagesIntroPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
    OurStoryPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
    ProgrammeItem:
      additionalProperties: false
      properties:
        label:
          examples:
            - Recepção dos convidados
          type: string
        time:
          description: Local time (America/Sao_Paulo), HH:MM.
          examples:
            - "15:00"
          type: string
      required:
        - time
        - label
      type: object
    RSVPAnswer:
      additionalProperties: false
      properties:
        attending:
          enum:
            - "yes"
            - "no"
          type: string
        guest_id:
          format: uuid
          type: string
      required:
        - guest_id
        - attending
      type: object
    RSVPInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RSVPInputBody.json
          format: uri
          readOnly: true
          type: string
        responses:
          description: Exactly one answer per member of the group.
          items:
            $ref: "#/components/schemas/RSVPAnswer"
          minItems: 1
          type:
            - array
            - "null"
      required:
        - responses
      type: object
    RSVPPayload:
      additionalProperties: false
      properties:
        body:
          description: Rich text as Markdown.
          type: string
        deadline:
          description: Last day (inclusive, America/Sao_Paulo) to submit or change RSVPs. Enforced server-side.
          examples:
            - "2027-07-07"
          format: date
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - deadline
        - title
      type: object
    Section:
      additionalProperties: false
      properties:
        big_day:
          $ref: "#/components/schemas/BigDayPayload"
        dress_code:
          $ref: "#/components/schemas/DressCodePayload"
        enabled:
          description: Disabled sections are hidden from the public site (server-side).
          type: boolean
        getting_there:
          $ref: "#/components/schemas/GettingTherePayload"
        gifts_intro:
          $ref: "#/components/schemas/GiftsIntroPayload"
        good_practices:
          $ref: "#/components/schemas/GoodPracticesPayload"
        hero:
          $ref: "#/components/schemas/HeroPayload"
        messages_intro:
          $ref: "#/components/schemas/MessagesIntroPayload"
        our_story:
          $ref: "#/components/schemas/OurStoryPayload"
        rsvp:
          $ref: "#/components/schemas/RSVPPayload"
        slug:
          enum:
            - hero
            - our_story
            - big_day
            - rsvp
            - getting_there
            - stay
            - gifts_intro
            - dress_code
            - good_practices
            - messages_intro
          type: string
        stay:
          $ref: "#/components/schemas/StayPayload"
      required:
        - slug
        - enabled
      type: object
    StayPayload:
      additionalProperties: false
      properties:
        airbnb_areas:
          description: Neighborhoods worth searching on Airbnb.
          items:
            type: string
          type:
            - array
            - "null"
        body:
          description: Rich text as Markdown.
          type: string
        images:
          description: Public CDN image URLs.
          items:
            type: string
          type:
            - array
            - "null"
        lodgings:
          items:
            $ref: "#/components/schemas/Lodging"
          type:
            - array
            - "null"
        title:
          description: Section heading shown on the site.
          type: string
      required:
        - title
      type: object
info:
  description: Backend for the wedding website of Jade & João — August 7, 2027, Atibaia-SP, Brazil. Single writer over Supabase (Postgres + Storage). Public surface serves the one-page site; /api/v1/admin/** requires a Supabase Auth JWT. All guest-facing messages are in Brazilian Portuguese.
  title: Jade & João Wedding API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/content:
    get:
      description: Returns every enabled editorial section in render order — the single call the public site makes for all of its copy.
      operationId: get-content
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get site content
      tags:
        - content
  /api/v1/guests/lookup:
    post:
      description: Exact normalized full-name match. Returns the guest group with every member's current RSVP state. No fuzzy matching or suggestions — misses return 404.
      operationId: lookup-guest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Find your invitation
      tags:
        - guests
  /api/v1/guests/{group_id}/rsvp:
    post:
      description: "Records one yes/no per member of the group. Idempotent: resubmitting overwrites earlier answers. Rejected after the RSVP deadline."
      operationId: submit-rsvp
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Submit RSVP
      tags:
        - guests
  /healthz:
    get:
      description: "Railway healthcheck endpoint: returns 200 when the service and its database connection are healthy."
      operationId: health-check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - system
