              schema:
                $ref: "#/components/schemas/ContributionOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare a contribution
      tags:
        - gifts
  /api/v1/gifts/{gift_id}/pix:
    get:
      description: Side-effect-free copia-e-cola preview — window-shopping creates nothing. The contribution is only recorded by POST /gifts/{gift_id}/contributions.
      operationId: preview-gift-pix
      parameters:
        - in: path
          name: gift_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Amount in centavos. Optional for quota gifts (defaults to one quota); required for free-amount gifts.
          explode: false
          in: query
          name: amount_centavos
          schema:
            description: Amount in centavos. Optional for quota gifts (defaults to one quota); required for free-amount gifts.
            format: int64
            maximum: 10000000000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PixOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview PIX code
      tags:
        - gifts
