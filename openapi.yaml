  securitySchemes:
    supabaseJWT:
      bearerFormat: JWT
      description: Supabase Auth access token of one of the couple's accounts (ADMIN_EMAILS).
      scheme: bearer
      type: http
info:
  description: Backend for the wedding website of Jade & João — August 7, 2027, Atibaia-SP, Brazil. Single writer over Supabase (Postgres + Storage). Public surface serves the one-page site; /api/v1/admin/** requires a Supabase Auth JWT. All guest-facing messages are in Brazilian Portuguese.
  title: Jade & João Wedding API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/contributions:
    get:
      description: The append-only ledger, newest first, with gift titles.
      operationId: admin-list-contributions
      parameters:
        - description: Filter by status; omit for all.
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; omit for all.
            enum:
              - declared
              - confirmed
              - cancelled
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: List contributions
      tags:
        - gifts
        - admin
  /api/v1/admin/contributions/{contribution_id}:
    patch:
      description: Only the admin transitions contribution status. Confirming stamps confirmed_at.
      operationId: admin-moderate-contribution
      parameters:
        - in: path
          name: contribution_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateContributionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Confirm or cancel a contribution
      tags:
        - gifts
        - admin
  /api/v1/admin/gifts:
    get:
      description: Every gift with computed progress, including deactivated ones.
      operationId: admin-list-gifts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiftsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: List all gifts
      tags:
        - gifts
        - admin
    post:
      operationId: admin-create-gift
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftParamsBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Create a gift
      tags:
        - gifts
        - admin
  /api/v1/admin/gifts/{gift_id}:
    delete:
      description: Hard-deletes only gifts with zero contributions; otherwise deactivates (the ledger is append-only history).
      operationId: admin-delete-gift
      parameters:
        - in: path
          name: gift_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGiftOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Delete or deactivate a gift
      tags:
        - gifts
        - admin
    put:
      operationId: admin-update-gift
      parameters:
        - in: path
          name: gift_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftParamsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Update a gift
      tags:
        - gifts
        - admin
  /api/v1/admin/groups/{group_id}:
    patch:
      description: Relabels the invitation — what the guest sees at the top of their card.
      operationId: admin-rename-invitation
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRenameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Rename an invitation
      tags:
        - guests
        - admin
  /api/v1/admin/groups/{group_id}/members:
    post:
      description: Merges someone into this invitation, tidying away the one they leave behind if it empties. Unlike the guest-facing path, the couple may move anyone.
      operationId: admin-merge-into-invitation
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - supabaseJWT: []
      summary: Move a guest into an invitation
      tags:
        - guests
        - admin
  /api/v1/admin/groups/{group_id}/primary:
    post:
      description: Makes this guest the one who answers for the invitation. Applied in a single statement, so the invitation never has two primaries or none.
      operationId: admin-set-primary
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
