    get:
      description: "Names this invitation may gather in: guests the couple already invited who are still alone in their own invitation. Someone heading an invitation that holds other people is excluded — moving them would orphan the rest."
      operationId: search-companions
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Começo do nome de quem vem junto; a busca ignora acentos e maiúsculas.
          explode: false
          in: query
          name: q
          required: true
          schema:
            description: Começo do nome de quem vem junto; a busca ignora acentos e maiúsculas.
            examples:
              - mar
            maxLength: 100
            minLength: 3
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionOptionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search people to bring along
      tags:
        - guests
