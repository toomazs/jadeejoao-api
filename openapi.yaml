      description: "Prefix typeahead for the RSVP name field: up to 8 full names, accent- and case-insensitive, rate-limited, debounced client-side. Returns names only — group data still requires the exact lookup."
      operationId: suggest-guest-names
      parameters:
        - description: Beginning of the guest's name; matching ignores case and accents.
          explode: false
          in: query
          name: q
          required: true
          schema:
            description: Beginning of the guest's name; matching ignores case and accents.
            examples:
              - edu
            maxLength: 100
            minLength: 3
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Suggest guest names
      tags:
        - guests
  /api/v1/guests/{group_id}/companions:
    post:
      description: Gathers one more ALREADY-INVITED person into this invitation, by id. The guest never types a name — the list is the couple's budget. Only people still alone in their own invitation can be gathered; capped at 10 per invitation, rejected after the RSVP deadline. Returns the whole group.
      operationId: add-companion
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a companion
      tags:
        - guests
