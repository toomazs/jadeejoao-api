components:
  schemas:
    AdminFeedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AdminFeedOutputBody.json
          format: uri
          readOnly: true
          type: string
        posts:
          items:
            $ref: "#/components/schemas/PostView"
          type:
            - array
            - "null"
      required:
        - posts
      type: object
    AdminGiftView:
      additionalProperties: false
      properties:
        active:
          description: False quando o presente está escondido do site.
          type: boolean
        confirmed_centavos:
          description: Sum of admin-confirmed contributions. Always 0 for link gifts.
          format: int64
          type: integer
        declared_centavos:
          description: Sum of declared (not yet confirmed) contributions. Always 0 for link gifts.
          format: int64
          type: integer
        description:
          type: string
        external_url:
          description: The couple's registry URL (link gifts only).
          format: uri
          type: string
        gift_id:
          format: uuid
          type: string
        goal_centavos:
          description: Goal amount in centavos (BRL). PIX gifts only.
          format: int64
          type: integer
        image_url:
          format: uri
          type: string
        kind:
          description: "pix: metas/cotas paid by PIX through the site. link: external store registry — the card redirects and no money flows through the API."
          enum:
            - pix
            - link
          type: string
        max_units:
          description: Maximum sellable quota units; null means unlimited. PIX gifts only.
          format: int32
          type: integer
        platform:
          description: Store slug for link gifts; the SPAs map it to a local logo asset.
          examples:
            - mercadolivre
          type: string
        quota_centavos:
          description: Fixed quota unit in centavos; contributions must be multiples. Null means free amount. PIX gifts only.
          format: int64
          type: integer
        sort:
          format: int32
          type: integer
        title:
          examples:
            - Para o João fazer a barba
          type: string
        units_left:
          description: "Remaining quota units (only for unit-limited PIX gifts). Optimistic: declared + confirmed consume units."
          format: int64
          type: integer
      required:
        - active
        - gift_id
        - title
        - kind
        - declared_centavos
        - confirmed_centavos
        - sort
      type: object
    AdminGiftsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AdminGiftsOutputBody.json
          format: uri
          readOnly: true
          type: string
        gifts:
          items:
            $ref: "#/components/schemas/AdminGiftView"
          type:
            - array
            - "null"
      required:
        - gifts
      type: object
    AdminMemberView:
      additionalProperties: false
      properties:
        added_by_guest:
          description: True quando o próprio convidado trouxe essa pessoa.
          type: boolean
        attending:
          enum:
            - pending
            - "yes"
            - "no"
          type: string
        category:
          enum:
            - adult
            - teen
            - child
            - baby
            - elderly
          type: string
        ceremony_role:
          description: Padrinho, madrinha, celebrante…
          type: string
        circle:
          description: "Círculo social: amigos, família, trabalho."
          type: string
        full_name:
          type: string
        gender:
          enum:
            - female
            - male
          type: string
        guest_id:
          format: uuid
          type: string
        is_primary:
          type: boolean
        notes:
          description: Anotação livre, normalmente parentesco.
          type: string
        side:
          description: De quem é o convidado.
          enum:
            - bride
            - groom
            - both
          type: string
      required:
        - guest_id
        - full_name
        - is_primary
        - attending
        - added_by_guest
      type: object
    AnnouncementPayload:
      additionalProperties: false
      properties:
        eye_x:
          description: Horizontal position of the wink, in percent.
          format: double
          maximum: 100
          minimum: 0
          type: number
        eye_y:
          description: Vertical position of the wink, in percent.
          format: double
          maximum: 100
          minimum: 0
          type: number
        image_url:
          description: Public CDN photo.
          format: uri
          type: string
        label:
          description: The caption written on the frame; **double asterisks** set a phrase in bold.
          examples:
            - Mamãe e papai **vão se casar!**
          type: string
      required:
        - label
        - image_url
      type: object
    BigDayPayload:
      additionalProperties: false
